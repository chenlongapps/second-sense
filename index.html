<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9ecf0" />
    <meta
      name="description"
      content="红色数码管、像素按钮。凭感觉挑战 3、5、10 秒，在恰好的那一刻停止。"
      data-i18n-attr="content:meta.description"
    />
    <title data-i18n="meta.title">秒感 · 像素读秒挑战</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23202429' d='M4 0h24v4h4v24h-4v4H4v-4H0V4h4z'/%3E%3Cpath fill='%23fa393e' d='M10 6h12v4H10zM6 10h4v12H6zM22 10h4v12h-4zM10 22h12v4H10z'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/zpix.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <a href="./" class="brand" aria-label="秒感首页" data-i18n-attr="aria-label:brand.label"
          ><span class="brand-mark" aria-hidden="true">S.</span
          ><span>秒感<span class="brand-en">SECOND SENSE</span></span></a
        >
        <div class="header-controls">
          <div class="locale-switch" id="locale-picker">
            <button
              id="locale-toggle"
              class="locale-toggle"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="当前语言：简体中文，点击切换"
            >
              <span id="locale-current" class="locale-current">简体中文</span>
              <svg class="locale-caret" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M0 0h10L5 6z" />
              </svg>
            </button>
            <ul id="locale-menu" class="locale-menu" role="listbox" tabindex="-1" hidden></ul>
          </div>
          <button
            id="sound-toggle"
            class="sound-toggle"
            type="button"
            aria-pressed="true"
            aria-label="音效已开启，点击静音"
            data-i18n-attr="aria-label:sound.ariaOn"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2 7h4V5h2V3h2v14H8v-2H6v-2H2z" />
              <path class="sound-waves" d="M12 6h2v8h-2zM16 3h2v14h-2z" />
              <path
                class="mute-mark"
                d="M12 8h2v2h2V8h2v2h-2v2h2v2h-2v-2h-2v2h-2v-2h2v-2h-2z"
              /></svg
            ><span id="sound-label" data-i18n="sound.labelOn">音效 开</span>
          </button>
          <a
            class="github-link"
            href="https://github.com/chenlongapps/second-sense"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="在 GitHub 上查看源码"
            data-i18n-attr="aria-label:github.label"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"
              /></svg
          ></a>
        </div>
      </header>
      <main>
        <div class="intro">
          <h1 data-i18n="intro.heading">凭感觉，停在那一秒。</h1>
        </div>
        <div class="play-layout">
          <div class="play-main">
            <section
              class="machine"
              aria-label="读秒游戏"
              data-i18n-attr="aria-label:machine.label"
            >
              <div class="machine-top">
                <span class="small-label" data-i18n="target.label">选择目标</span>
                <div
                  class="target-options"
                  role="group"
                  aria-label="选择目标秒数"
                  data-i18n-attr="aria-label:target.groupLabel"
                >
                  <button
                    type="button"
                    class="target"
                    data-seconds="3"
                    aria-pressed="false"
                    data-i18n="target.option"
                    data-i18n-params='{"n":3}'
                  >
                    3 秒</button
                  ><button
                    type="button"
                    class="target active"
                    data-seconds="5"
                    aria-pressed="true"
                    data-i18n="target.option"
                    data-i18n-params='{"n":5}'
                  >
                    5 秒</button
                  ><button
                    type="button"
                    class="target"
                    data-seconds="10"
                    aria-pressed="false"
                    data-i18n="target.option"
                    data-i18n-params='{"n":10}'
                  >
                    10 秒
                  </button>
                </div>
              </div>
              <div class="display-housing" id="dial">
                <div id="pixel-sparks" class="pixel-sparks" aria-hidden="true"></div>
                <div class="display-top">
                  <span id="dial-label" data-i18n="display.labelTarget">目标时间</span
                  ><span id="status" aria-live="polite" data-i18n="status.ready">准备就绪</span>
                </div>
                <div
                  class="digital-display"
                  id="dial-number"
                  role="img"
                  aria-label="5.00 秒"
                  data-i18n-attr="aria-label:display.seconds"
                  data-i18n-params='{"value":"5.00"}'
                ></div>
                <div class="display-units" aria-hidden="true">
                  <span>MIN</span><span>SEC</span><span>1/100</span>
                </div>
              </div>
              <div class="control-area">
                <p id="dial-caption" class="control-prompt" data-i18n="caption.idle">点击开始。</p>
                <div id="easter-egg" class="easter-egg" role="status" hidden>
                  <div class="easter-egg-heading">
                    <span id="easter-egg-title" class="easter-egg-title"></span>
                    <span id="easter-egg-diff" class="easter-egg-diff"></span>
                  </div>
                  <p id="easter-egg-message" class="easter-egg-message"></p>
                </div>
                <div class="button-base">
                  <button type="button" id="action" class="action" aria-labelledby="action-label">
                    <span class="button-cap"
                      ><span id="action-glyph" aria-hidden="true">GO</span></span
                    >
                  </button>
                </div>
                <span id="action-label" class="action-label" data-i18n="action.labelIdle"
                  >开始挑战</span
                >
                <p class="keyboard-hint" data-i18n="keyboard.hint">空格开始 / 停止</p>
              </div>
            </section>
            <p id="notice" class="notice" role="status"></p>
          </div>
          <aside class="history" aria-labelledby="history-title">
            <h2 id="history-title" data-i18n="history.title">近五次记录</h2>
            <p id="history-empty" class="history-empty" data-i18n="history.empty">暂无记录</p>
            <ol id="history-list" class="history-list"></ol>
          </aside>
        </div>
      </main>
      <footer><span>SECOND SENSE / 01</span></footer>
    </div>
    <div
      id="victory-overlay"
      class="victory-overlay"
      role="status"
      aria-live="polite"
      tabindex="-1"
      hidden
    >
      <div id="victory-confetti" class="victory-confetti" aria-hidden="true"></div>
      <div id="victory-card" class="victory-card">
        <p class="victory-kicker" aria-hidden="true">PERFECT</p>
        <p id="victory-title" class="victory-title"></p>
        <p id="victory-time" class="victory-time"></p>
        <p id="victory-message" class="victory-message"></p>
        <p class="victory-hint" data-i18n="victory.hint">点击画面 / 空格 / Esc 跳过</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
