<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9ecf0" />
    <meta
      name="description"
      content="红色数码管、像素按钮。凭感觉挑战 3、5、10 秒，在恰好的那一刻停止。"
    />
    <title>秒感 · 像素读秒挑战</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23202429' d='M4 0h24v4h4v24h-4v4H4v-4H0V4h4z'/%3E%3Cpath fill='%23fa393e' d='M10 6h12v4H10zM6 10h4v12H6zM22 10h4v12h-4zM10 22h12v4H10z'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/zpix.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <a href="./" class="brand" aria-label="秒感首页"
          ><span class="brand-mark" aria-hidden="true">S.</span
          ><span>秒感<span class="brand-en">SECOND SENSE</span></span></a
        >
        <div class="header-controls">
          <button
            id="sound-toggle"
            class="sound-toggle"
            type="button"
            aria-pressed="true"
            aria-label="音效已开启，点击静音"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2 7h4V5h2V3h2v14H8v-2H6v-2H2z" />
              <path class="sound-waves" d="M12 6h2v8h-2zM16 3h2v14h-2z" />
              <path
                class="mute-mark"
                d="M12 8h2v2h2V8h2v2h-2v2h2v2h-2v-2h-2v2h-2v-2h2v-2h-2z"
              /></svg
            ><span id="sound-label">音效 开</span>
          </button>
        </div>
      </header>
      <main>
        <div class="intro">
          <h1>凭感觉，停在那一秒。</h1>
        </div>
        <div class="play-layout">
          <div class="play-main">
            <section class="machine" aria-label="读秒游戏">
              <div class="machine-top">
                <span class="small-label">选择目标</span>
                <div class="target-options" role="group" aria-label="选择目标秒数">
                  <button type="button" class="target" data-seconds="3" aria-pressed="false">
                    3 秒</button
                  ><button type="button" class="target active" data-seconds="5" aria-pressed="true">
                    5 秒</button
                  ><button type="button" class="target" data-seconds="10" aria-pressed="false">
                    10 秒
                  </button>
                </div>
              </div>
              <div class="display-housing" id="dial">
                <div id="pixel-sparks" class="pixel-sparks" aria-hidden="true"></div>
                <div class="display-top">
                  <span id="dial-label">目标时间</span
                  ><span id="status" aria-live="polite">准备就绪</span>
                </div>
                <div
                  class="digital-display"
                  id="dial-number"
                  role="img"
                  aria-label="目标时间 5 秒"
                ></div>
                <div class="display-units" aria-hidden="true">
                  <span>MIN</span><span>SEC</span><span>1/100</span>
                </div>
              </div>
              <div class="control-area">
                <p id="dial-caption" class="control-prompt">点击开始。</p>
                <div id="easter-egg" class="easter-egg" role="status" hidden>
                  <div class="easter-egg-heading">
                    <span id="easter-egg-title" class="easter-egg-title"></span>
                    <span id="easter-egg-diff" class="easter-egg-diff"></span>
                  </div>
                  <p id="easter-egg-message" class="easter-egg-message"></p>
                </div>
                <div class="button-base">
                  <button type="button" id="action" class="action" aria-labelledby="action-label">
                    <span class="button-cap"
                      ><span id="action-glyph" aria-hidden="true">GO</span></span
                    >
                  </button>
                </div>
                <span id="action-label" class="action-label">开始挑战</span>
                <p class="keyboard-hint">空格开始 / 停止</p>
              </div>
            </section>
            <p id="notice" class="notice" role="status"></p>
          </div>
          <aside class="history" aria-labelledby="history-title">
            <h2 id="history-title">近五次记录</h2>
            <p id="history-empty" class="history-empty">暂无记录</p>
            <ol id="history-list" class="history-list"></ol>
          </aside>
        </div>
      </main>
      <footer><span>SECOND SENSE / 01</span></footer>
    </div>
    <div
      id="victory-overlay"
      class="victory-overlay"
      role="status"
      aria-live="polite"
      tabindex="-1"
      hidden
    >
      <div id="victory-confetti" class="victory-confetti" aria-hidden="true"></div>
      <div id="victory-card" class="victory-card">
        <p class="victory-kicker" aria-hidden="true">PERFECT</p>
        <p id="victory-title" class="victory-title"></p>
        <p id="victory-time" class="victory-time"></p>
        <p id="victory-message" class="victory-message"></p>
        <p class="victory-hint">点击画面 / 空格 / Esc 跳过</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
