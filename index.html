<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9ecf0">
<meta name="description" content="红色数码管、像素按钮。凭感觉挑战 3、5、10 秒，在恰好的那一刻停止。"><title>秒感 · 像素读秒挑战</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23202429' d='M4 0h24v4h4v24h-4v4H4v-4H0V4h4z'/%3E%3Cpath fill='%23fa393e' d='M10 6h12v4H10zM6 10h4v12H6zM22 10h4v12h-4zM10 22h12v4H10z'/%3E%3C/svg%3E">
<link rel="preload" href="zpix.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css"><script src="sounds.js" defer></script><script src="game.js" defer></script>
</head>
<body><div class="shell">
<header class="header"><a href="./" class="brand" aria-label="秒感首页"><span class="brand-mark" aria-hidden="true">S.</span><span>秒感<span class="brand-en">SECOND SENSE</span></span></a><div class="header-controls"><span class="header-note">读秒挑战 / TIME CHALLENGE</span><button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true" aria-label="音效已开启，点击静音"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7h4V5h2V3h2v14H8v-2H6v-2H2z"/><path class="sound-waves" d="M12 6h2v8h-2zM16 3h2v14h-2z"/><path class="mute-mark" d="M12 8h2v2h2V8h2v2h-2v2h2v2h-2v-2h-2v2h-2v-2h2v-2h-2z"/></svg><span id="sound-label">音效 开</span></button></div></header>
<main><div class="intro"><p class="eyebrow">READY. SET. FEEL.</p><h1>凭感觉，停在那一秒。</h1><p>选一个目标，心里读秒。到点就按下红色按钮。</p></div>
<section class="machine" aria-label="读秒游戏">
<div class="machine-top"><span class="small-label">选择目标</span><div class="target-options" role="group" aria-label="选择目标秒数"><button type="button" class="target" data-seconds="3" aria-pressed="false">3 秒</button><button type="button" class="target active" data-seconds="5" aria-pressed="true">5 秒</button><button type="button" class="target" data-seconds="10" aria-pressed="false">10 秒</button></div></div>
<div class="display-housing" id="dial"><div class="display-top"><span id="dial-label">目标时间</span><span id="status">准备就绪</span></div><div class="digital-display" id="dial-number" role="img" aria-label="目标时间 5 秒"></div><div class="display-units" aria-hidden="true"><span>MIN</span><span>SEC</span><span>1/100</span></div></div>
<div class="control-area"><p id="dial-caption" class="control-prompt">准备好了，就开始吧。</p><div class="button-base"><button type="button" id="action" class="action" aria-labelledby="action-label"><span class="button-cap"><span id="action-glyph" aria-hidden="true">GO</span></span></button></div><span id="action-label" class="action-label">开始挑战</span><p class="keyboard-hint"><kbd>SPACE</kbd> 或点击按钮 · 开始 / 停止</p></div>
</section><p id="notice" class="notice" role="status"></p>
<section class="result-card" aria-labelledby="result-heading"><div class="result-head"><h2 id="result-heading">本轮成绩</h2><span class="round-badge" id="round-badge">ROUND 01</span></div><div id="result-body" aria-live="polite" aria-atomic="true"><div class="empty-result"><span class="empty-score">— —</span><p>还没有成绩。你的第一轮会有多准？</p></div></div></section>
<section class="stats" aria-label="本次游戏统计"><div><span class="stat-label">最高得分</span><strong id="best">—</strong></div><div><span class="stat-label">平均误差</span><strong id="average">—</strong></div><div><span class="stat-label">完成挑战</span><strong id="count">0<span> 次</span></strong></div></section><p class="game-note">计时中不显示时间 · 越接近目标，得分越高</p></main>
<footer><span>把时间交给直觉。</span><span>SECOND SENSE / 01</span></footer></div></body></html>
